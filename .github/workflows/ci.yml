name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: El build tiene que ser un solo archivo
        run: |
          files=$(find dist -type f | wc -l)
          echo "archivos en dist: $files"
          test "$files" -eq 1
          test -f dist/index.html

      # los unitarios de tracking no necesitan navegador: fallan en segundos
      - run: pnpm test --project=node
        env:
          CI: true

      - run: npx playwright install --with-deps chrome

      - run: pnpm test --project=chrome
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jelly-watermelon-knife
          path: dist/index.html
          if-no-files-found: error
